<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refaey Farm Tracker | دفتر دورات الدواجن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Design Tokens - Natural, Professional & Grounded (No AI Glare / No Neon)
   ========================================================================== */
:root {
  --font-sans: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-num: 'JetBrains Mono', monospace;

  /* Dark Theme (Default) - Crisp Charcoal / Graphite Slate */
  --bg-page: #11141a;
  --bg-surface: #181c24;
  --bg-surface-hover: #202632;
  --bg-surface-elevated: #222836;
  --bg-subtle: #1c212c;

  --border-color: #272d3b;
  --border-subtle: #1f2430;
  --border-focus: #15803d;

  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;

  /* Natural Business Colors (No Glowing Neon) */
  --color-brand: #15803d;         /* Forest green */
  --color-brand-hover: #166534;
  --color-success: #16a34a;       /* Profit */
  --color-success-bg: #0d2818;
  --color-success-text: #4ade80;

  --color-danger: #dc2626;        /* Loss / Mortality */
  --color-danger-bg: #2d1517;
  --color-danger-text: #f87171;

  --color-warning: #d97706;       /* Notice */
  --color-warning-bg: #2b1f0c;
  --color-warning-text: #fbbf24;

  --color-info: #0284c7;
  --color-info-bg: #0c2333;
  --color-info-text: #38bdf8;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-pill: 9999px;

  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-dropdown: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
  --transition: all 0.15s ease-in-out;
}

:root[data-theme="light"] {
  --bg-page: #f8fafc;
  --bg-surface: #ffffff;
  --bg-surface-hover: #f1f5f9;
  --bg-surface-elevated: #ffffff;
  --bg-subtle: #f1f5f9;

  --border-color: #e2e8f0;
  --border-subtle: #edf2f7;
  --border-focus: #15803d;

  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;

  --color-brand: #15803d;
  --color-brand-hover: #166534;
  --color-success: #15803d;
  --color-success-bg: #ecfdf5;
  --color-success-text: #166534;

  --color-danger: #b91c1c;
  --color-danger-bg: #fef2f2;
  --color-danger-text: #991b1b;

  --color-warning: #b45309;
  --color-warning-bg: #fffbeb;
  --color-warning-text: #92400e;

  --color-info: #0369a1;
  --color-info-bg: #f0f9ff;
  --color-info-text: #075985;

  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-dropdown: 0 10px 25px -5px rgba(15, 23, 42, 0.15);
}

/* ==========================================================================
   Base & Layout
   ========================================================================== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-page);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  transition: background-color 0.2s ease, color 0.2s ease;
}

.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 24px 16px 80px;
}

/* ==========================================================================
   Header Bar
   ========================================================================== */
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-color);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon-box {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-md);
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.greeting-text {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.date-text {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  margin-top: 1px;
}

.theme-switcher {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  padding: 6px 12px;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: var(--transition);
}

.theme-switcher:hover {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
  border-color: var(--border-focus);
}

/* ==========================================================================
   Cards & Surfaces
   ========================================================================== */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-card);
  transition: var(--transition);
}

/* Financial Ledger Hero Card */
.ledger-hero {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 20px;
}

.ledger-hero-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.ledger-hero-amount {
  font-size: 38px;
  font-weight: 700;
  font-family: var(--font-num);
  line-height: 1.1;
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.ledger-hero-amount small {
  font-size: 16px;
  font-weight: 600;
  font-family: var(--font-sans);
  color: var(--text-secondary);
}

.ledger-summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 16px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border-color);
}

.ledger-summary-item {
  display: flex;
  flex-direction: column;
}

.ledger-summary-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.ledger-summary-value {
  font-size: 18px;
  font-weight: 700;
  font-family: var(--font-num);
  color: var(--text-primary);
  margin-top: 2px;
}

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  padding: 10px 18px;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
}

.btn-primary {
  background: var(--color-brand);
  color: #ffffff;
  border-color: var(--color-brand);
}

.btn-primary:hover {
  background: var(--color-brand-hover);
  border-color: var(--color-brand-hover);
}

.btn-outline {
  background: var(--bg-surface);
  border-color: var(--border-color);
  color: var(--text-primary);
}

.btn-outline:hover {
  background: var(--bg-surface-hover);
  border-color: var(--text-secondary);
}

.btn-danger {
  background: var(--color-danger-bg);
  border-color: var(--border-color);
  color: var(--color-danger-text);
}

.btn-danger:hover {
  background: var(--color-danger);
  color: #ffffff;
}

.btn-full {
  width: 100%;
  padding: 14px;
  font-size: 16px;
}

.btn-sm {
  padding: 5px 12px;
  font-size: 13px;
  border-radius: var(--radius-sm);
}

/* ==========================================================================
   Section Headers & Titles
   ========================================================================== */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 28px 0 14px;
}

.section-heading {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}

/* ==========================================================================
   Cycle Card List
   ========================================================================== */
.cycle-card {
  cursor: pointer;
}

.cycle-card:hover {
  border-color: var(--border-focus);
  background: var(--bg-surface-hover);
}

.cycle-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.cycle-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.cycle-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
}

.cycle-dates {
  font-size: 13px;
  color: var(--text-secondary);
}

/* Clean, Non-Neon Status Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
}

.badge-active {
  background: var(--color-success-bg);
  color: var(--color-success-text);
  border: 1px solid var(--color-success);
}

.badge-closed {
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
}

.cycle-stats-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 12px;
  border-top: 1px solid var(--border-color);
}

.cycle-stat-col {
  display: flex;
  flex-direction: column;
}

.cycle-stat-col.left {
  text-align: left;
}

/* ==========================================================================
   Metrics Grid (Production, FCR, Mortality)
   ========================================================================== */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

@media (min-width: 600px) {
  .metrics-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.metric-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.metric-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.metric-value {
  font-size: 20px;
  font-weight: 700;
  font-family: var(--font-num);
  color: var(--text-primary);
  line-height: 1.2;
}

.metric-footer {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ==========================================================================
   Tabs Control
   ========================================================================== */
.tabs-scroller {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin: 22px 0 14px;
  scrollbar-width: none;
}
.tabs-scroller::-webkit-scrollbar {
  display: none;
}

.tab-btn {
  white-space: nowrap;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  padding: 8px 16px;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.tab-btn:hover {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
}

.tab-btn.active {
  background: var(--color-brand);
  color: #ffffff;
  border-color: var(--color-brand);
}

/* ==========================================================================
   List Records (Expenses, Incomes, Debts)
   ========================================================================== */
.record-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-color);
  gap: 12px;
}

.record-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.record-row:first-child {
  padding-top: 0;
}

.record-primary {
  font-weight: 600;
  font-size: 15px;
  color: var(--text-primary);
}

.record-secondary {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.record-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.record-amount {
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font-num);
}

/* ==========================================================================
   Charts & Progress
   ========================================================================== */
.bar-track {
  height: 10px;
  border-radius: 5px;
  background: var(--bg-subtle);
  overflow: hidden;
  display: flex;
  margin-top: 6px;
}

.bar-fill {
  height: 100%;
}

.chart-item {
  margin-top: 14px;
}
.chart-item:first-of-type {
  margin-top: 4px;
}

.chart-item-header {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 2px;
}

.legend-box {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}

.legend-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-color-dot {
  width: 9px;
  height: 9px;
  border-radius: 2px;
}

/* ==========================================================================
   Back Navigation & Modal
   ========================================================================== */
.back-link {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  transition: var(--transition);
}

.back-link:hover {
  color: var(--text-primary);
  border-color: var(--border-focus);
}

#m {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 99;
  padding: 16px;
}

#m.on {
  display: flex;
}

#m form {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 480px;
  padding: 24px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-dropdown);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin: 12px 0 6px;
}

input, select {
  width: 100%;
  background: var(--bg-subtle);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  font-family: inherit;
  font-size: 14px;
  transition: var(--transition);
  outline: none;
}

input:focus, select:focus {
  border-color: var(--border-focus);
}

select option {
  background: var(--bg-surface);
  color: var(--text-primary);
}

/* Helpers */
.num {
  font-family: var(--font-num);
  direction: ltr;
  unicode-bidi: isolate;
}

.txt-success { color: var(--color-success) !important; }
.txt-danger { color: var(--color-danger) !important; }
.txt-warning { color: var(--color-warning) !important; }

.empty-view {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-muted);
}
.empty-view-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.footer {
  text-align: center;
  margin-top: 36px;
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}

.footer-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  font: inherit;
  cursor: pointer;
  text-decoration: underline;
}
</style>
</head>

<div class="container">
  <!-- Top Header -->
  <header class="top-header">
    <div class="header-brand">
      <div class="brand-icon-box">🐔</div>

        <h1 class="greeting-text" id="gr">مرحباً يا رفاعي</h1>

  </header>

  <!-- Main View -->
  <main id="app"></main>

<script>
// Available categories
const cats = ['علف', 'كتاكيت', 'أدوية وتحصينات', 'كهرباء وغاز', 'عمالة', 'نقل', 'أخرى'];

// Default sample data
const initialCycles = [
  {
    id: 1,
    name: 'دورة أغسطس',
    start: '2026-08-01',
    end: '2026-09-10',
    n: 1000,
    exp: [
      { d: '2026-08-01', cat: 'كتاكيت', amt: 18000, note: '1000 كتكوت' },
      { d: '2026-08-05', cat: 'علف', amt: 22000, note: '' },
      { d: '2026-08-20', cat: 'أدوية وتحصينات', amt: 3500, note: '' },
      { d: '2026-08-25', cat: 'علف', amt: 26000, note: '' },
      { d: '2026-09-01', cat: 'عمالة', amt: 4000, note: '' }
    ],
    inc: [
      { d: '2026-09-08', cnt: 480, kg: 960, amt: 43200, buyer: 'تاجر الأحد' },
      { d: '2026-09-10', cnt: 490, kg: 990, amt: 44500, buyer: 'محل الشرقية' }
    ],
    dead: [
      { d: '2026-08-12', n: 18, note: '' },
      { d: '2026-08-28', n: 12, note: '' }
    ],
    feed: [
      { d: '2026-08-05', kg: 1500, txt: '30 شكارة' },
      { d: '2026-08-25', kg: 1700, txt: '34 شكارة' }
    ],
    debt: []
  },
  {
    id: 2,
    name: 'دورة أكتوبر',
    start: '2026-10-01',
    end: null,
    n: 800,
    exp: [
      { d: '2026-10-01', cat: 'كتاكيت', amt: 15200, note: '800 كتكوت' },
      { d: '2026-10-04', cat: 'علف', amt: 9000, note: '' },
      { d: '2026-10-12', cat: 'أدوية وتحصينات', amt: 1800, note: '' }
    ],
    inc: [],
    dead: [{ d: '2026-10-10', n: 9, note: '' }],
    feed: [{ d: '2026-10-04', kg: 600, txt: '12 شكارة' }],
    debt: [{ d: '2026-10-15', who: 'أبو علي', dir: 'ليا عنده', amt: 2000, paid: false }]
  }
];

// Persistent State
const STORAGE_KEY = 'refaey_farm_cycles_v3';
let C = [];
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  C = saved ? JSON.parse(saved) : initialCycles;
} catch (e) {
  C = initialCycles;
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(C));
  } catch (err) {
    console.error('Storage error', err);
  }
}

function resetDataPrompt() {
  if (confirm('هل تريد استعادة البيانات الافتراضية؟')) {
    C = JSON.parse(JSON.stringify(initialCycles));
    saveData();
    render();
  }
}

let bagKg = 50;
let nid = C.reduce((m, x) => Math.max(m, x.id), 0) + 1;

// Utilities
const f = n => Math.round(n).toLocaleString('en-US');
const fd = d => new Date(d + 'T00:00').toLocaleDateString('ar-EG-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const today = () => new Date().toISOString().slice(0, 10);
const sum = (arr, key) => (arr || []).reduce((s, x) => s + (+x[key] || 0), 0);

// Key Metric Calculations
function calc(c) {
  const e = sum(c.exp, 'amt');
  const i = sum(c.inc, 'amt');
  const dead = sum(c.dead, 'n');
  const sold = sum(c.inc, 'cnt');
  const kgS = sum(c.inc, 'kg');
  const fk = sum(c.feed, 'kg');
  const p = i - e;
  const live = c.n - dead;
  return {
    e,
    i,
    p,
    dead,
    sold,
    fk,
    live,
    mort: c.n ? (dead / c.n) * 100 : 0,
    cpb: live > 0 ? e / live : 0,
    avg: sold ? i / sold : 0,
    ppb: sold ? p / sold : 0,
    fcr: kgS ? fk / kgS : 0
  };
}

let S = { v: 'list', tab: 'exp' };

const K = {
  exp: {
    t: 'مصروف',
    icon: '🧾',
    f: [
      ['cat', 'select', cats, 'النوع'],
      ['amt', 'number', '', 'المبلغ (جنيه)'],
      ['note', 'text', '', 'ملاحظة']
    ],
    r: e => [e.cat + (e.note ? ' - ' + e.note : ''), f(e.amt) + ' ج']
  },
  inc: {
    t: 'إيراد (حركة بيع)',
    icon: '💵',
    f: [
      ['cnt', 'number', '', 'عدد الطيور'],
      ['kg', 'number', '', 'الوزن الإجمالي (كجم)'],
      ['amt', 'number', '', 'المبلغ (جنيه)'],
      ['buyer', 'text', '', 'اسم المشتري']
    ],
    r: e => ['بيع ' + e.cnt + ' طائر ' + (e.buyer ? '(' + e.buyer + ')' : ''), f(e.amt) + ' ج']
  },
  dead: {
    t: 'نفوق',
    icon: '⚠️',
    f: [
      ['n', 'number', '', 'عدد الطيور'],
      ['note', 'text', '', 'ملاحظة']
    ],
    r: e => ['نفوق ' + e.n + ' طائر' + (e.note ? ' - ' + e.note : ''), e.n + ' طيور']
  },
  feed: {
    t: 'علف',
    icon: '🌾',
    f: [
      ['unit', 'select', ['شكارة', 'كيلو'], 'الوحدة'],
      ['q', 'number', '', 'الكمية']
    ],
    r: e => ['علف: ' + e.txt, f(e.kg) + ' كجم']
  },
  debt: {
    t: 'مديونية',
    icon: '📝',
    f: [
      ['dir', 'select', ['ليا عنده', 'عليا لحد'], 'نوع المديونية'],
      ['who', 'text', '', 'الاسم'],
      ['amt', 'number', '', 'المبلغ (جنيه)']
    ],
    r: e => [e.who + ' (' + e.dir + ')', f(e.amt) + ' ج']
  }
};

const tabs = [
  ['exp', 'المصروفات'],
  ['inc', 'المبيعات والإيراد'],
  ['dead', 'النفوق'],
  ['feed', 'العلف'],
  ['debt', 'الديون'],
  ['ch', 'التحليل والتقارير']
];

const cur = () => C.find(c => c.id === S.v);

function metricCard(label, val, footer, icon, colorClass = '') {
  return `
    <div class="metric-card">
      <div class="metric-header">
        <span>${label}</span>
        <span>${icon}</span>
      </div>
      <div class="metric-value ${colorClass}">${val}</div>
      <div class="metric-footer">${footer}</div>
    </div>
  `;
}

function bars(items, fmt) {
  const m = Math.max(1, ...items.map(x => Math.abs(x.v)));
  return items.map(x => `
    <div class="chart-item">
      <div class="chart-item-header">
        <span>${x.n}</span>
        <span class="num ${x.cls || ''}">${fmt(x)}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width: ${Math.max(2, (Math.abs(x.v) / m) * 100)}%; background: ${x.c};"></div>
      </div>
    </div>
  `).join('');
}

function profitChart() {
  return bars(
    C.map(c => {
      const p = calc(c).p;
      return {
        n: c.name,
        v: p,
        c: p >= 0 ? 'var(--color-success)' : 'var(--color-danger)',
        cls: p >= 0 ? 'txt-success' : 'txt-danger',
        t: (p >= 0 ? 'ربح ' : 'خسارة ') + f(Math.abs(p)) + ' ج'
      };
    }),
    x => x.t
  );
}

// Master Overview List View
function list(a) {
  const tot = C.reduce((s, c) => s + calc(c).p, 0);
  const activeCycles = C.filter(c => !c.end).length;
  const totalBirds = C.reduce((s, c) => s + c.n, 0);

  a.innerHTML = `
    <!-- Ledger Total Card -->
    <div class="ledger-hero">
      <div class="ledger-hero-title">إجمالي صافي أرباح الدورات</div>
      <div class="ledger-hero-amount ${tot >= 0 ? 'txt-success' : 'txt-danger'}">
        ${f(tot)} <small>جنيه</small>
      </div>

      <div class="ledger-summary-grid">
        <div class="ledger-summary-item">
          <span class="ledger-summary-label">الدورات الجارية</span>
          <span class="ledger-summary-value txt-success">${activeCycles} جارية</span>
        </div>
        <div class="ledger-summary-item">
          <span class="ledger-summary-label">إجمالي الدورات</span>
          <span class="ledger-summary-value">${C.length} مسجلة</span>
        </div>
        <div class="ledger-summary-item">
          <span class="ledger-summary-label">إجمالي الكتاكيت</span>
          <span class="ledger-summary-value">${f(totalBirds)} طائر</span>
        </div>
      </div>
    </div>

    <!-- Start New Cycle Button -->
    <button class="btn btn-primary btn-full" onclick="newCycle()">
      + تسجيل دورة جديدة
    </button>

    <!-- Cycle List Section -->
    <div class="section-header">
      <span class="section-heading">الدورات المسجلة</span>
      <span class="badge ${activeCycles > 0 ? 'badge-active' : 'badge-closed'}">
        ${activeCycles > 0 ? activeCycles + ' جارية' : 'لا توجد دورات جارية'}
      </span>
    </div>

    <!-- Cycle Cards -->
    ${C.slice().reverse().map(c => {
      const k = calc(c);
      const isOngoing = !c.end;
      return `
        <div class="card cycle-card" onclick="S.v=${c.id}; S.tab='exp'; render()">
          <div class="cycle-card-top">
            <div class="cycle-info">
              <div class="brand-icon-box" style="width: 38px; height: 38px; font-size: 18px;">🐔</div>
              <div>
                <div class="cycle-name">${c.name}</div>
                <div class="cycle-dates">بدأت: ${fd(c.start)}</div>
              </div>
            </div>
            <span class="badge ${isOngoing ? 'badge-active' : 'badge-closed'}">
              ${isOngoing ? 'جارية' : 'مكتملة'}
            </span>
          </div>

          <div class="cycle-stats-bar">
            <div class="cycle-stat-col">
              <span class="ledger-summary-label">العدد الأصلي</span>
              <span class="num" style="font-weight: 600;">${f(c.n)} طائر</span>
            </div>
            <div class="cycle-stat-col">
              <span class="ledger-summary-label">النافق</span>
              <span class="num ${k.mort > 5 ? 'txt-danger' : ''}" style="font-weight: 600;">
                ${k.dead} (${k.mort.toFixed(1)}%)
              </span>
            </div>
            <div class="cycle-stat-col left">
              <span class="ledger-summary-label">${k.p >= 0 ? 'صافي الربح' : 'الخسارة'}</span>
              <span class="num ${k.p >= 0 ? 'txt-success' : 'txt-danger'}" style="font-size: 18px; font-weight: 700;">
                ${f(Math.abs(k.p))} ج
              </span>
            </div>
          </div>
        </div>
      `;
    }).join('')}

    <!-- Comparison Chart -->
    <div class="section-header">
      <span class="section-heading">مقارنة ربحية الدورات</span>
    </div>
    <div class="card">
      ${profitChart()}
    </div>
  `;
}

// Single Cycle Detail View
function detail(a) {
  const c = cur();
  if (!c) {
    S.v = 'list';
    return list(a);
  }
  const k = calc(c);
  const isOngoing = !c.end;

  let h = `
    <button class="back-link" onclick="S.v='list'; render()">
      <span>→</span> كل الدورات
    </button>

    <div class="ledger-hero">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
        <div>
          <h2 style="font-size: 22px; font-weight: 700; color: var(--text-primary);">${c.name}</h2>
          <div class="ledger-summary-label" style="margin-top: 2px;">
            بدأت ${fd(c.start)} ${c.end ? ' • انتهت ' + fd(c.end) : ''}
          </div>
        </div>
        <span class="badge ${isOngoing ? 'badge-active' : 'badge-closed'}">
          ${isOngoing ? 'جارية' : 'مكتملة'}
        </span>
      </div>

      <div class="ledger-hero-title" style="margin-top: 14px;">
        ${k.p >= 0 ? 'صافي ربح الدورة' : 'الخسارة حتى الآن'}
      </div>
      <div class="ledger-hero-amount ${k.p >= 0 ? 'txt-success' : 'txt-danger'}">
        ${f(Math.abs(k.p))} <small>جنيه</small>
      </div>

      <div class="ledger-summary-grid">
        <div class="ledger-summary-item">
          <span class="ledger-summary-label">إجمالي المبيعات (وارد)</span>
          <span class="ledger-summary-value txt-success">${f(k.i)} ج</span>
        </div>
        <div class="ledger-summary-item">
          <span class="ledger-summary-label">إجمالي المصروفات (منصرف)</span>
          <span class="ledger-summary-value txt-danger">${f(k.e)} ج</span>
        </div>
      </div>
    </div>

    <!-- Flock Metrics -->
    <div class="section-header">
      <span class="section-heading">القطيع والطيور</span>
    </div>
    <div class="metrics-grid">
      ${metricCard('العدد الأصلي', f(c.n), 'استلام المزرعة', '🐣')}
      ${metricCard('النافق', f(k.dead), 'نسبة ' + k.mort.toFixed(1) + '%', '⚠️', k.mort > 5 ? 'txt-danger' : '')}
      ${metricCard('المباع', f(k.sold), 'بمتوسط ' + f(k.avg) + ' ج', '💵', 'txt-success')}
      ${metricCard('المتبقي', f(Math.max(0, k.live - k.sold)), 'بالمزرعة حالياً', '🏠')}
    </div>

    <!-- Production & Cost Metrics -->
    <div class="section-header">
      <span class="section-heading">التكلفة والكفاءة الإنتاجية</span>
    </div>
    <div class="metrics-grid">
      ${metricCard('تكلفة الطائر', f(k.cpb) + ' ج', 'المصروف ÷ الحي', '📊')}
      ${metricCard('ربح الطائر', f(k.ppb) + ' ج', 'الربح ÷ المباع', '📈', k.ppb >= 0 ? 'txt-success' : 'txt-danger')}
      ${metricCard('العلف المستهلك', f(k.fk) + ' كجم', 'إجمالي المشترى', '🌾')}
      ${metricCard('معامل التحويل FCR', k.fcr ? k.fcr.toFixed(2) : '-', 'كجم علف / كجم لحم', '⚖️', k.fcr && k.fcr <= 1.6 ? 'txt-success' : 'txt-warning')}
    </div>

    <!-- Tabs Navigation -->
    <div class="tabs-scroller">
      ${tabs.map(t => `
        <button class="tab-btn ${S.tab === t[0] ? 'active' : ''}" onclick="S.tab='${t[0]}'; render()">
          ${t[1]}
        </button>
      `).join('')}
    </div>
  `;

  // Tab View
  if (S.tab === 'ch') {
    const by = {};
    c.exp.forEach(e => {
      by[e.cat] = (by[e.cat] || 0) + e.amt;
    });
    
    // Natural, restrained color scheme for chart items
    const chartColors = [
      '#16a34a', // green
      '#0284c7', // blue
      '#d97706', // amber
      '#dc2626', // red
      '#7c3aed', // purple
      '#475569'  // slate
    ];

    const it = Object.entries(by)
      .sort((x, y) => y[1] - x[1])
      .map(([n, v], i) => ({
        n,
        v,
        c: chartColors[i % chartColors.length],
        t: f(v) + ' ج (' + (k.e ? Math.round((v / k.e) * 100) : 0) + '%)'
      }));

    const rem = Math.max(0, k.live - k.sold);
    const T = c.n || 1;

    h += `
      <div class="card">
        <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text-primary);">
          توزيع المصروفات حسب البنود
        </h3>
        ${it.length ? bars(it, x => x.t) : '<div class="empty-view">لا توجد مصروفات مسجلة بعد</div>'}
      </div>

      <div class="card">
        <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text-primary);">
          توزيع أعداد الطيور
        </h3>
        <div class="bar-track" style="height: 12px;">
          <div class="bar-fill" style="width: ${(k.sold / T) * 100}%; background: var(--color-success);" title="مباع"></div>
          <div class="bar-fill" style="width: ${(k.dead / T) * 100}%; background: var(--color-danger);" title="نافق"></div>
          <div class="bar-fill" style="width: ${(rem / T) * 100}%; background: #0284c7;" title="باقي"></div>
        </div>
        <div class="legend-box">
          <span class="legend-tag"><span class="legend-color-dot" style="background: var(--color-success);"></span> مباع: ${f(k.sold)} (${Math.round((k.sold / T) * 100)}%)</span>
          <span class="legend-tag"><span class="legend-color-dot" style="background: var(--color-danger);"></span> نافق: ${f(k.dead)} (${Math.round((k.dead / T) * 100)}%)</span>
          <span class="legend-tag"><span class="legend-color-dot" style="background: #0284c7;"></span> متبقي: ${f(rem)} (${Math.round((rem / T) * 100)}%)</span>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text-primary);">
          مقارنة ربحية هذه الدورة مع الدورات الأخرى
        </h3>
        ${profitChart()}
      </div>
    `;
  } else {
    const T = K[S.tab];
    const arr = c[S.tab] || [];

    h += `
      <button class="btn btn-primary btn-full" onclick="openForm('${S.tab}')">
        + إضافة ${T.t}
      </button>
    `;

    if (S.tab === 'feed') {
      h += `
        <div class="card" style="margin-top: 12px; padding: 14px;">
          <label style="margin-top: 0;">وزن الشكارة الافتراضي (كجم):</label>
          <input type="number" value="${bagKg}" onchange="bagKg = +this.value || 50" style="max-width: 140px;">
        </div>
      `;
    }

    h += `
      <div class="card" style="margin-top: 12px;">
        ${arr.length ? arr.slice().reverse().map(e => {
          const r = T.r(e);
          const i = arr.indexOf(e);
          return `
            <div class="record-row">
              <div>
                <div class="record-primary">${r[0]}</div>
                <div class="record-secondary">${fd(e.d)}</div>
              </div>
              <div class="record-right">
                <span class="record-amount">${r[1]}</span>
                <div style="display: flex; gap: 6px;">
                  ${S.tab === 'debt' ? `
                    <button class="btn btn-sm ${e.paid ? 'btn-outline' : 'btn-primary'}" onclick="pay(${i})">
                      ${e.paid ? 'اتسدد ✓' : 'تسديد'}
                    </button>
                  ` : ''}
                  <button class="btn btn-sm btn-danger" onclick="del(${i})">حذف</button>
                </div>
              </div>
            </div>
          `;
        }).join('') : `
          <div class="empty-view">
            <div class="empty-view-icon">${T.icon}</div>
            لا توجد تسجيلات في هذا القسم بعد
          </div>
        `}
      </div>
    `;
  }

  if (!c.end) {
    h += `
      <div style="margin-top: 20px;">
        <button class="btn btn-outline btn-full btn-danger" onclick="closeC()">
          إغلاق هذه الدورة (انتهاء البيع)
        </button>
      </div>
    `;
  }

  a.innerHTML = h;
}

function render() {
  const a = document.getElementById('app');
  if (S.v === 'list') {
    list(a);
  } else {
    detail(a);
  }
}

// Modal and Form Handling
const m = document.getElementById('m');
const fm = document.getElementById('fm');

function openForm(kind) {
  const T = K[kind];
  let h = `
    <div class="modal-header">
      <div class="modal-title">إضافة ${T.t}</div>
      <button type="button" class="btn btn-sm btn-outline" onclick="closeM()">✕</button>
    </div>
    
    <label>التاريخ</label>
    <input type="date" id="f_d" value="${today()}">
  `;

  T.f.forEach(x => {
    h += `<label>${x[3]}</label>`;
    if (x[1] === 'select') {
      h += `
        <select id="f_${x[0]}">
          ${x[2].map(o => `<option value="${o}">${o}</option>`).join('')}
        </select>
      `;
    } else {
      h += `
        <input id="f_${x[0]}" type="${x[1]}" ${x[1] === 'number' ? 'inputmode="decimal" step="any"' : ''} placeholder="${x[3]}">
      `;
    }
  });

  h += `
    <div style="display: flex; gap: 8px; margin-top: 20px;">
      <button class="btn btn-primary" style="flex: 2;" type="submit">حفظ</button>
      <button class="btn btn-outline" style="flex: 1;" type="button" onclick="closeM()">إلغاء</button>
    </div>
  `;

  fm.innerHTML = h;
  fm.onsubmit = ev => {
    ev.preventDefault();
    const o = { d: document.getElementById('f_d').value || today() };
    T.f.forEach(x => {
      const el = document.getElementById('f_' + x[0]);
      o[x[0]] = x[1] === 'number' ? (+el.value || 0) : el.value;
    });

    if (kind === 'feed') {
      o.kg = o.unit === 'شكارة' ? o.q * bagKg : o.q;
      o.txt = o.q + ' ' + o.unit;
    }
    if (kind === 'debt') {
      o.paid = false;
    }

    cur()[kind].push(o);
    saveData();
    closeM();
    render();
  };

  m.classList.add('on');
}

function newCycle() {
  fm.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">تسجيل دورة جديدة</div>
      <button type="button" class="btn btn-sm btn-outline" onclick="closeM()">✕</button>
    </div>

    <label>اسم الدورة</label>
    <input id="nn" value="دورة جديدة" placeholder="مثلاً: دورة نوفمبر">

    <label>تاريخ البدء</label>
    <input type="date" id="ns" value="${today()}">

    <label>عدد الكتاكيت المستلمة</label>
    <input type="number" id="nc" inputmode="numeric" placeholder="مثلاً: 1000">

    <div style="display: flex; gap: 8px; margin-top: 20px;">
      <button class="btn btn-primary" style="flex: 2;" type="submit">إنشاء الدورة</button>
      <button class="btn btn-outline" style="flex: 1;" type="button" onclick="closeM()">إلغاء</button>
    </div>
  `;

  fm.onsubmit = ev => {
    ev.preventDefault();
    const nn = document.getElementById('nn');
    const ns = document.getElementById('ns');
    const nc = document.getElementById('nc');

    const newObj = {
      id: nid++,
      name: nn.value.trim() || 'دورة بدون اسم',
      start: ns.value || today(),
      end: null,
      n: +nc.value || 0,
      exp: [],
      inc: [],
      dead: [],
      feed: [],
      debt: []
    };

    C.push(newObj);
    saveData();
    closeM();
    S.v = newObj.id;
    S.tab = 'exp';
    render();
  };

  m.classList.add('on');
}

function closeM() {
  m.classList.remove('on');
}

function del(i) {
  if (confirm('هل تريد حذف هذا التسجيل؟')) {
    cur()[S.tab].splice(i, 1);
    saveData();
    render();
  }
}

function pay(i) {
  const e = cur().debt[i];
  e.paid = !e.paid;
  saveData();
  render();
}

function closeC() {
  if (confirm('هل تريد إغلاق هذه الدورة؟')) {
    cur().end = today();
    saveData();
    render();
  }
}

// Header
const gr = document.getElementById('gr');
const dt = document.getElementById('dt');
const hours = new Date().getHours();
gr.textContent = (hours < 12 ? 'صباح الخير' : 'مساء الخير') + ' يا رفاعي';
dt.textContent = fd(today());

// Theme Toggle
const thBtn = document.getElementById('th');
const thIcon = document.getElementById('th-icon');
const thLabel = document.getElementById('th-label');

function updateThemeUI(theme) {
  document.documentElement.dataset.theme = theme;
  if (theme === 'light') {
    thIcon.textContent = '☾';
    thLabel.textContent = 'داكن';
  } else {
    thIcon.textContent = '☀︎';
    thLabel.textContent = 'فاتح';
  }
}

const savedTheme = localStorage.getItem('refaey_theme') || 'dark';
updateThemeUI(savedTheme);

thBtn.onclick = () => {
  const current = document.documentElement.dataset.theme;
  const target = current === 'light' ? 'dark' : 'light';
  localStorage.setItem('refaey_theme', target);
  updateThemeUI(target);
};

m.onclick = e => {
  if (e.target === m) closeM();
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeM();
});

// Run Initial Render
render();
</script>
</body>
</html>
