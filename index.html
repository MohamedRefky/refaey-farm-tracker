<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Refaey Farm Tracker - تطبيق إدارة ومتابعة دورات مزارع الدواجن وتسمين الفراخ">
  <title>Refaey Farm Tracker | دفتر دورات الدواجن</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="w">
    <!-- Top Navigation & Brand Header -->
    <header class="top-bar">
      <div class="brand-wrapper">
        <div class="brand-icon">🐥</div>
        <div>
          <h1 class="greeting-title" id="gr">
            مرحباً بك <span class="chick-anim">🐥</span>
          </h1>
          <div class="greeting-date" id="dt"></div>
        </div>
      </div>
      
      <div class="header-actions">
        <button class="theme-btn" id="th" title="تغيير المظهر">
          <span id="th-icon">☀︎</span>
          <span id="th-text">فاتح</span>
        </button>
      </div>
    </header>

    <!-- Dynamic Main Application Shell -->
    <main id="app" role="main"></main>
    
    <!-- App Footer -->
    <footer class="footer-note">
      <span>Refaey Farm Tracker © 2026</span>
      <span>•</span>
      <span>يتم الحفظ تلقائياً في جهازك</span>
      <span>•</span>
      <button type="button" onclick="resetDataPrompt()">استعادة البيانات الافتراضية</button>
    </footer>
  </div>

  <!-- Reusable Transaction & Batch Modal Dialog -->
  <div id="m" role="dialog" aria-modal="true" aria-hidden="true">
    <form id="fm" autocomplete="off"></form>
  </div>

  <!-- Modular Scripts Architecture -->
  <script src="js/data.js"></script>
  <script src="js/calculations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
