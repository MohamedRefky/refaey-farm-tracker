<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Refaey Farm Tracker - تطبيق إدارة ومتابعة دورات مزارع الدواجن وتسمين الفراخ">
  <title>Refaey Farm Tracker | دفتر دورات الدواجن</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="src/styles/style.css?v=31">
</head>
<body>

  <div class="w">
    <!-- Top Navigation & Brand Header -->
    <header class="top-bar">
      <div class="brand-wrapper">
        <div class="brand-icon">🐥</div>
        <div>
          <h1 class="greeting-title" id="gr">
            مرحباً بك <span class="chick-anim">🐥</span>
          </h1>
          <div class="greeting-date" id="dt"></div>
        </div>
      </div>
      
      <div class="header-actions">
        <button class="theme-btn privacy-btn" id="money-privacy-toggle" type="button" aria-pressed="true">
          <span id="money-privacy-icon">🙈</span>
          <span id="money-privacy-label">إظهار المبالغ</span>
        </button>
        <button class="theme-btn" id="th" title="تغيير المظهر">
          <span id="th-icon">☀︎</span>
          <span id="th-text">فاتح</span>
        </button>
      </div>
    </header>

    <!-- Offline / Storage Status Banner -->
    <div id="sync_status_banner" class="sync-status-banner" style="display: none;" role="status" aria-live="polite"></div>

    <!-- Dynamic Main Application Shell -->
    <main id="app" role="main"></main>
    
    <!-- App Footer -->
    <footer class="footer-note">
      <span>Refaey Farm Tracker © 2026</span>
      <span>•</span>
      <span>حفظ محلي + مزامنة سحابية (Firebase)</span>
      <span>•</span>
      <button type="button" onclick="resetDataPrompt()">مسح جميع البيانات</button>
    </footer>
  </div>

  <!-- Reusable Transaction & Batch Modal Dialog -->
  <div id="m" role="dialog" aria-modal="true" aria-hidden="true">
    <form id="fm" autocomplete="off"></form>
  </div>

  <!-- Reusable Custom Confirmation Warning Dialog -->
  <div id="cm" class="confirm-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <!-- Firebase Compat SDK (works both online & via file://) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- Modular Scripts Architecture -->
  <script src="src/js/core/data.js?v=20"></script>
  <script src="src/js/core/calculations.js?v=25"></script>
  <script src="src/js/ui/ui-core.js?v=13"></script>
  <script src="src/js/ui/forms.js?v=40"></script>
  <script src="src/js/ui/tabs.js?v=25"></script>
  <script src="src/js/ui/views.js?v=48"></script>
  <script src="src/js/app.js?v=20"></script>
  <script src="src/js/core/firebase-sync.js?v=2"></script>
</body>
</html>
