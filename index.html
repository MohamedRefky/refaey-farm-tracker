<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refaey Farm Tracker | دفتر دورات الدواجن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Design System - Modern, Vibrant & Interactive (With Glow & Micro-Animations)
   ========================================================================== */
:root {
  --font-sans: 'Cairo', system-ui, -apple-system, sans-serif;
  --font-num: 'JetBrains Mono', monospace;

  /* Dark Theme (Default) */
  --bg-app: #080c14;
  --bg-card: rgba(16, 24, 39, 0.85);
  --bg-card-hover: rgba(26, 38, 60, 0.95);
  --bg-surface-elevated: #162032;
  --bg-subtle: rgba(255, 255, 255, 0.04);

  --border-subtle: rgba(255, 255, 255, 0.09);
  --border-glow: rgba(16, 185, 129, 0.35);

  --text-main: #f8fafc;
  --text-title: #ffffff;
  --text-muted: #94a3b8;
  --text-dim: #64748b;

  /* Vibrant Accents */
  --emerald: #10b981;
  --emerald-glow: rgba(16, 185, 129, 0.3);
  --emerald-light: rgba(16, 185, 129, 0.12);

  --amber: #f59e0b;
  --amber-glow: rgba(245, 158, 11, 0.25);
  --amber-light: rgba(245, 158, 11, 0.12);

  --rose: #f43f5e;
  --rose-glow: rgba(244, 63, 94, 0.25);
  --rose-light: rgba(244, 63, 94, 0.12);

  --sky: #0ea5e9;
  --sky-light: rgba(14, 165, 233, 0.12);

  --gradient-brand: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --gradient-hero: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(14, 165, 233, 0.08) 100%);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 9999px;

  --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 25px rgba(16, 185, 129, 0.15);
  --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

:root[data-theme="light"] {
  --bg-app: #f1f5f9;
  --bg-card: rgba(255, 255, 255, 0.95);
  --bg-card-hover: #ffffff;
  --bg-surface-elevated: #ffffff;
  --bg-subtle: #f8fafc;

  --border-subtle: rgba(15, 23, 42, 0.08);
  --border-glow: rgba(5, 150, 105, 0.3);

  --text-main: #0f172a;
  --text-title: #020617;
  --text-muted: #64748b;
  --text-dim: #94a3b8;

  --emerald: #059669;
  --emerald-glow: rgba(5, 150, 105, 0.2);
  --emerald-light: rgba(5, 150, 105, 0.1);

  --amber: #d97706;
  --amber-glow: rgba(217, 119, 6, 0.2);
  --amber-light: rgba(217, 119, 6, 0.1);

  --rose: #e11d48;
  --rose-glow: rgba(225, 29, 72, 0.2);
  --rose-light: rgba(225, 29, 72, 0.1);

  --sky: #0284c7;
  --sky-light: rgba(2, 132, 199, 0.1);

  --gradient-brand: linear-gradient(135deg, #059669 0%, #047857 100%);
  --gradient-hero: linear-gradient(135deg, rgba(5, 150, 105, 0.1) 0%, rgba(2, 132, 199, 0.06) 100%);

  --shadow-card: 0 4px 16px -2px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(5, 150, 105, 0.1);
  --shadow-modal: 0 20px 40px -8px rgba(15, 23, 42, 0.2);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* Atmospheric Ambient Lights (Subtle & Beautiful) */
body::before {
  content: "";
  position: fixed;
  top: -100px;
  right: -50px;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: "";
  position: fixed;
  bottom: 0;
  left: -80px;
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.w {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 20px 100px;
  position: relative;
  z-index: 1;
}

/* Header & Top Bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-subtle);
}

.brand-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 46px;
  height: 46px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(16, 185, 129, 0.2));
  border: 1px solid var(--border-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 0 16px var(--emerald-glow);
  flex-shrink: 0;
}

.greeting-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text-title);
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.greeting-date {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}

.theme-btn {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: var(--transition);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.theme-btn:hover {
  border-color: var(--emerald);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px var(--emerald-glow);
}

/* Common Card with Soft Glow */
.card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-card);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

/* Hero / Overview Banner with Gradient & Glow */
.hero-card {
  background: var(--gradient-hero), var(--bg-card);
  border-color: var(--border-glow);
  box-shadow: var(--shadow-card), var(--shadow-glow);
  padding: 26px;
}

.hero-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.hero-big-number {
  font-size: 42px;
  font-weight: 800;
  font-family: var(--font-num);
  line-height: 1.1;
  letter-spacing: -0.03em;
  display: flex;
  align-items: baseline;
  gap: 8px;
  text-shadow: 0 0 24px var(--emerald-glow);
}

.hero-big-number small {
  font-size: 18px;
  font-weight: 700;
  font-family: var(--font-sans);
  color: var(--text-muted);
}

.hero-stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 16px;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border-subtle);
}

.hero-substat {
  display: flex;
  flex-direction: column;
}

.hero-substat-label {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 600;
}

.hero-substat-value {
  font-size: 20px;
  font-weight: 800;
  font-family: var(--font-num);
  margin-top: 2px;
}

/* Buttons with Gradient & Glow */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: var(--radius-md);
  padding: 12px 20px;
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
}

.btn-primary {
  background: var(--gradient-brand);
  color: #ffffff;
  box-shadow: 0 4px 14px var(--emerald-glow);
}

.btn-primary:hover {
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
  transform: translateY(-2px);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-outline {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-main);
  border: 1px solid var(--border-subtle);
}

.btn-outline:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: var(--emerald);
  transform: translateY(-1px);
}

.btn-full {
  width: 100%;
  padding: 15px;
  font-size: 16px;
  border-radius: var(--radius-md);
}

.btn-sm {
  padding: 6px 14px;
  font-size: 13px;
  border-radius: var(--radius-sm);
}

.btn-danger {
  background: var(--rose-light);
  color: var(--rose);
  border: 1px solid rgba(244, 63, 94, 0.3);
}

.btn-danger:hover {
  background: var(--rose);
  color: #fff;
  box-shadow: 0 4px 14px var(--rose-glow);
}

/* Cycle Card Listing */
.section-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-title);
  margin: 30px 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.cycle-card {
  cursor: pointer;
  transition: var(--transition);
  border-color: var(--border-subtle);
}

.cycle-card:hover {
  border-color: var(--border-glow);
  background: var(--bg-card-hover);
  transform: translateY(-3px);
  box-shadow: 0 10px 25px -4px rgba(0, 0, 0, 0.4), 0 0 18px var(--emerald-glow);
}

.cycle-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.cycle-title-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.cycle-icon-box {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(14, 165, 233, 0.15));
  border: 1px solid var(--border-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.cycle-name {
  font-size: 18px;
  font-weight: 800;
  color: var(--text-title);
}

.cycle-date {
  font-size: 13px;
  color: var(--text-muted);
}

/* ==========================================================================
   STATUS BADGES & THE GLOWING GREEN LIGHT (النور الأخضر النابض)
   ========================================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 700;
}

/* The Beautiful Glowing Green Light (النور الأخضر) */
.badge-active {
  background: rgba(16, 185, 129, 0.15);
  color: var(--emerald);
  border: 1px solid rgba(16, 185, 129, 0.4);
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
}

.badge-active::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background-color: #10b981;
  box-shadow: 0 0 10px #10b981, 0 0 18px rgba(16, 185, 129, 0.7);
  animation: pulseBeacon 1.6s infinite ease-in-out;
}

@keyframes pulseBeacon {
  0% {
    transform: scale(0.9);
    opacity: 0.7;
    box-shadow: 0 0 8px #10b981;
  }
  50% {
    transform: scale(1.35);
    opacity: 1;
    box-shadow: 0 0 16px #10b981, 0 0 24px rgba(16, 185, 129, 0.9);
  }
  100% {
    transform: scale(0.9);
    opacity: 0.7;
    box-shadow: 0 0 8px #10b981;
  }
}

.badge-closed {
  background: rgba(148, 163, 184, 0.12);
  color: var(--text-muted);
  border: 1px solid var(--border-subtle);
}

.cycle-details-grid {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  border-top: 1px solid var(--border-subtle);
}

/* Numbers Formatting */
.num {
  font-family: var(--font-num);
  direction: ltr;
  unicode-bidi: isolate;
}

.color-emerald { color: var(--emerald) !important; }
.color-rose { color: var(--rose) !important; }
.color-amber { color: var(--amber) !important; }

/* Grid of Statistics */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

@media (min-width: 640px) {
  .stats-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.stat-box {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: var(--transition);
}

.stat-box:hover {
  border-color: var(--border-glow);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
}

.stat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.stat-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
}

.stat-icon {
  font-size: 18px;
}

.stat-value {
  font-size: 22px;
  font-weight: 800;
  font-family: var(--font-num);
  color: var(--text-title);
  line-height: 1.2;
}

.stat-hint {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  margin-top: 4px;
}

/* Tabs Navigation */
.tabs-container {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin: 24px 0 16px;
  scrollbar-width: none;
}
.tabs-container::-webkit-scrollbar {
  display: none;
}

.tab-pill {
  white-space: nowrap;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  padding: 10px 18px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
}

.tab-pill:hover {
  color: var(--text-main);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-1px);
}

.tab-pill.active {
  background: var(--gradient-brand);
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 4px 14px var(--emerald-glow);
}

/* List Items / Transactions */
.record-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--border-subtle);
  gap: 12px;
}

.record-item:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.record-item:first-child {
  padding-top: 0;
}

.record-title {
  font-weight: 700;
  font-size: 15px;
  color: var(--text-title);
}

.record-date {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.record-value-group {
  text-align: left;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.record-value {
  font-size: 17px;
  font-weight: 800;
  font-family: var(--font-num);
}

.record-actions {
  display: flex;
  gap: 6px;
}

/* Animated Progress Bars */
.bar-track {
  height: 12px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
  display: flex;
  margin-top: 8px;
}

.bar-segment {
  height: 100%;
  transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}

.chart-row {
  margin-top: 18px;
}
.chart-row:first-of-type {
  margin-top: 8px;
}

.chart-header {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 4px;
}

.legend-wrapper {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 16px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

/* Back Button */
.back-btn {
  background: var(--emerald-light);
  border: 1px solid var(--border-glow);
  color: var(--emerald);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  transition: var(--transition);
}

.back-btn:hover {
  transform: translateX(4px);
  box-shadow: 0 0 12px var(--emerald-glow);
}

/* Modal Overlay & Animation */
#m {
  position: fixed;
  inset: 0;
  background: rgba(4, 7, 13, 0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 99;
  padding: 20px;
  animation: fadeIn 0.2s ease-out;
}

#m.on {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

#m form {
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 520px;
  padding: 28px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-modal), var(--shadow-glow);
  animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { transform: translateY(20px) scale(0.97); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

.form-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border-subtle);
}

.form-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-title);
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  margin: 14px 0 6px;
}

input, select {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  font-family: inherit;
  font-size: 15px;
  transition: var(--transition);
  outline: none;
}

input:focus, select:focus {
  border-color: var(--emerald);
  box-shadow: 0 0 0 3px var(--emerald-glow);
  background: rgba(255, 255, 255, 0.08);
}

select option {
  background: #111827;
  color: var(--text-main);
}

/* ==========================================================================
   THE HOPPING CHICK ANIMATION (انميشن الكتكوت المتحرك)
   ========================================================================== */
.chick-anim {
  display: inline-block;
  animation: hopChick 1.4s ease-in-out infinite;
  transform-origin: bottom center;
}

@keyframes hopChick {
  0%, 100% {
    transform: translateY(0) rotate(0deg);
  }
  35% {
    transform: translateY(-8px) rotate(-8deg);
  }
  55% {
    transform: translateY(0) rotate(5deg);
  }
}

.empty-state {
  text-align: center;
  padding: 36px 20px;
  color: var(--text-muted);
}
.empty-state-icon {
  font-size: 36px;
  margin-bottom: 10px;
}

/* Footer */
.footer-note {
  text-align: center;
  margin-top: 40px;
  font-size: 13px;
  color: var(--text-dim);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}
.footer-note button {
  background: none;
  border: none;
  color: var(--text-muted);
  font: inherit;
  cursor: pointer;
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="w">
  <!-- Top Navigation Bar -->
  <header class="top-bar">
    <div class="brand-wrapper">
      <div class="brand-icon">🐥</div>
      <div>
        <h1 class="greeting-title" id="gr">
          مرحباً بك <span class="chick-anim">🐥</span>
        </h1>
        <div class="greeting-date" id="dt"></div>
      </div>
    </div>
    
    <button class="theme-btn" id="th" title="تغيير المظهر">
      <span id="th-icon">☀︎</span>
      <span id="th-text">فاتح</span>
    </button>
  </header>

  <!-- Dynamic Content Container -->
  <main id="app"></main>
  
  <footer class="footer-note">
    <span>Refaey Farm Tracker © 2026</span>
    <span>•</span>
    <span>يتم الحفظ تلقائياً في جهازك</span>
    <span>•</span>
    <button onclick="resetDataPrompt()">استعادة البيانات الافتراضية</button>
  </footer>
</div>

<!-- Modal Dialog -->
<div id="m" role="dialog" aria-modal="true">
  <form id="fm"></form>
</div>

<script>
// Available expense categories
const cats = ['علف', 'كتاكيت', 'أدوية وتحصينات', 'كهرباء وغاز', 'عمالة', 'نقل', 'أخرى'];

// Default sample data
const initialCycles = [
  {
    id: 1,
    name: 'دورة أغسطس',
    start: '2026-08-01',
    end: '2026-09-10',
    n: 1000,
    exp: [
      { d: '2026-08-01', cat: 'كتاكيت', amt: 18000, note: '1000 كتكوت' },
      { d: '2026-08-05', cat: 'علف', amt: 22000, note: '' },
      { d: '2026-08-20', cat: 'أدوية وتحصينات', amt: 3500, note: '' },
      { d: '2026-08-25', cat: 'علف', amt: 26000, note: '' },
      { d: '2026-09-01', cat: 'عمالة', amt: 4000, note: '' }
    ],
    inc: [
      { d: '2026-09-08', cnt: 480, kg: 960, amt: 43200, buyer: 'تاجر الأحد' },
      { d: '2026-09-10', cnt: 490, kg: 990, amt: 44500, buyer: 'محل الشرقية' }
    ],
    dead: [
      { d: '2026-08-12', n: 18, note: '' },
      { d: '2026-08-28', n: 12, note: '' }
    ],
    feed: [
      { d: '2026-08-05', kg: 1500, txt: '30 شكارة' },
      { d: '2026-08-25', kg: 1700, txt: '34 شكارة' }
    ],
    debt: []
  },
  {
    id: 2,
    name: 'دورة أكتوبر',
    start: '2026-10-01',
    end: null,
    n: 800,
    exp: [
      { d: '2026-10-01', cat: 'كتاكيت', amt: 15200, note: '800 كتكوت' },
      { d: '2026-10-04', cat: 'علف', amt: 9000, note: '' },
      { d: '2026-10-12', cat: 'أدوية وتحصينات', amt: 1800, note: '' }
    ],
    inc: [],
    dead: [{ d: '2026-10-10', n: 9, note: '' }],
    feed: [{ d: '2026-10-04', kg: 600, txt: '12 شكارة' }],
    debt: [{ d: '2026-10-15', who: 'أبو علي', dir: 'ليا عنده', amt: 2000, paid: false }]
  }
];

// Persistent State Storage
const STORAGE_KEY = 'refaey_farm_cycles_v4';
let C = [];
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  C = saved ? JSON.parse(saved) : initialCycles;
} catch (e) {
  C = initialCycles;
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(C));
  } catch (err) {
    console.error('Storage error', err);
  }
}

function resetDataPrompt() {
  if (confirm('هل تريد استعادة البيانات الافتراضية؟')) {
    C = JSON.parse(JSON.stringify(initialCycles));
    saveData();
    render();
  }
}

let bagKg = 50;
let nid = C.reduce((m, x) => Math.max(m, x.id), 0) + 1;

// Formatting utilities
const f = n => Math.round(n).toLocaleString('en-US');
const fd = d => new Date(d + 'T00:00').toLocaleDateString('ar-EG-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const today = () => new Date().toISOString().slice(0, 10);
const sum = (arr, key) => (arr || []).reduce((s, x) => s + (+x[key] || 0), 0);

// Key Metric Calculations
function calc(c) {
  const e = sum(c.exp, 'amt');
  const i = sum(c.inc, 'amt');
  const dead = sum(c.dead, 'n');
  const sold = sum(c.inc, 'cnt');
  const kgS = sum(c.inc, 'kg');
  const fk = sum(c.feed, 'kg');
  const p = i - e;
  const live = c.n - dead;
  return {
    e,
    i,
    p,
    dead,
    sold,
    fk,
    live,
    mort: c.n ? (dead / c.n) * 100 : 0,
    cpb: live > 0 ? e / live : 0,
    avg: sold ? i / sold : 0,
    ppb: sold ? p / sold : 0,
    fcr: kgS ? fk / kgS : 0
  };
}

let S = { v: 'list', tab: 'exp' };

const K = {
  exp: {
    t: 'مصروف',
    icon: '💸',
    f: [
      ['cat', 'select', cats, 'النوع'],
      ['amt', 'number', '', 'المبلغ (جنيه)'],
      ['note', 'text', '', 'ملاحظة أو بيان']
    ],
    r: e => [e.cat + (e.note ? ' - ' + e.note : ''), f(e.amt) + ' ج']
  },
  inc: {
    t: 'إيراد (حركة بيع)',
    icon: '📈',
    f: [
      ['cnt', 'number', '', 'عدد الطيور المباعة'],
      ['kg', 'number', '', 'الوزن الكلي (كجم)'],
      ['amt', 'number', '', 'المبلغ المحصل (جنيه)'],
      ['buyer', 'text', '', 'اسم المشتري / التاجر']
    ],
    r: e => ['بيع ' + e.cnt + ' طائر ' + (e.buyer ? '(' + e.buyer + ')' : ''), f(e.amt) + ' ج']
  },
  dead: {
    t: 'نفوق',
    icon: '⚠️',
    f: [
      ['n', 'number', '', 'عدد الطيور النافقة'],
      ['note', 'text', '', 'سبب النفوق / ملاحظة']
    ],
    r: e => ['نفوق ' + e.n + ' طائر' + (e.note ? ' - ' + e.note : ''), e.n + ' طيور']
  },
  feed: {
    t: 'علف مستهلك',
    icon: '🌾',
    f: [
      ['unit', 'select', ['شكارة', 'كيلو'], 'الوحدة'],
      ['q', 'number', '', 'الكمية']
    ],
    r: e => ['علف: ' + e.txt, f(e.kg) + ' كجم']
  },
  debt: {
    t: 'مديونية',
    icon: '📝',
    f: [
      ['dir', 'select', ['ليا عنده', 'عليا لحد'], 'نوع المديونية'],
      ['who', 'text', '', 'اسم الطرف الآخر'],
      ['amt', 'number', '', 'المبلغ (جنيه)']
    ],
    r: e => [e.who + ' (' + e.dir + ')', f(e.amt) + ' ج']
  }
};

const tabs = [
  ['exp', '💸 المصروفات'],
  ['inc', '📈 المبيعات والإيراد'],
  ['dead', '⚠️ النفوق'],
  ['feed', '🌾 العلف'],
  ['debt', '📝 الديون'],
  ['ch', '📊 التحليل والتقارير']
];

const cur = () => C.find(c => c.id === S.v);

function statBox(label, val, hint, icon, colorCls = '') {
  return `
    <div class="stat-box">
      <div class="stat-header">
        <span class="stat-label">${label}</span>
        <span class="stat-icon">${icon}</span>
      </div>
      <div class="stat-value ${colorCls}">${val}</div>
      <div class="stat-hint">${hint}</div>
    </div>
  `;
}

function bars(items, fmt) {
  const m = Math.max(1, ...items.map(x => Math.abs(x.v)));
  return items.map(x => `
    <div class="chart-row">
      <div class="chart-header">
        <span>${x.n}</span>
        <span class="num ${x.cls || ''}">${fmt(x)}</span>
      </div>
      <div class="bar-track">
        <div class="bar-segment" style="width: ${Math.max(2, (Math.abs(x.v) / m) * 100)}%; background: ${x.c};"></div>
      </div>
    </div>
  `).join('');
}

function profitChart() {
  return bars(
    C.map(c => {
      const p = calc(c).p;
      return {
        n: c.name,
        v: p,
        c: p >= 0 ? 'var(--emerald)' : 'var(--rose)',
        cls: p >= 0 ? 'color-emerald' : 'color-rose',
        t: (p >= 0 ? 'ربح ' : 'خسارة ') + f(Math.abs(p)) + ' ج'
      };
    }),
    x => x.t
  );
}

// Master Overview List View
function list(a) {
  const tot = C.reduce((s, c) => s + calc(c).p, 0);
  const activeCount = C.filter(c => !c.end).length;
  const totalBirds = C.reduce((s, c) => s + c.n, 0);

  a.innerHTML = `
    <!-- Top Hero Overview Card with Glow -->
    <div class="card hero-card">
      <div class="hero-label">
        <span>📊</span> إجمالي أرباح جميع الدورات
      </div>
      <div class="hero-big-number ${tot >= 0 ? 'color-emerald' : 'color-rose'}">
        ${f(tot)} <small>جنيه مصري</small>
      </div>

      <div class="hero-stats-row">
        <div class="hero-substat">
          <span class="hero-substat-label">الدورات الجارية</span>
          <span class="hero-substat-value color-emerald">${activeCount} شغالين</span>
        </div>
        <div class="hero-substat">
          <span class="hero-substat-label">إجمالي الدورات</span>
          <span class="hero-substat-value">${C.length} دورات</span>
        </div>
        <div class="hero-substat">
          <span class="hero-substat-label">إجمالي الكتاكيت</span>
          <span class="hero-substat-value">${f(totalBirds)} طائر</span>
        </div>
      </div>
    </div>

    <!-- Start New Cycle Button -->
    <button class="btn btn-primary btn-full" onclick="newCycle()">
      <span>+</span> بدء دورة جديدة
    </button>

    <!-- Cycle List Section -->
    <div class="section-title">
      <span>دوراتي المسجلة</span>
      <span class="badge ${activeCount > 0 ? 'badge-active' : 'badge-closed'}">
        ${activeCount > 0 ? activeCount + ' جارية الآن' : 'مكتملة'}
      </span>
    </div>

    <!-- Cycle Cards -->
    ${C.slice().reverse().map(c => {
      const k = calc(c);
      const isOngoing = !c.end;
      return `
        <div class="card cycle-card" onclick="S.v=${c.id}; S.tab='exp'; render()">
          <div class="cycle-card-header">
            <div class="cycle-title-group">
              <div class="cycle-icon-box">🐔</div>
              <div>
                <div class="cycle-name">${c.name}</div>
                <div class="cycle-date">بدأت: ${fd(c.start)}</div>
              </div>
            </div>
            <!-- The Glowing Green Light Beacon (النور الأخضر النابض) -->
            <span class="badge ${isOngoing ? 'badge-active' : 'badge-closed'}">
              ${isOngoing ? 'شغالة الآن' : 'مكتملة'}
            </span>
          </div>

          <div class="cycle-details-grid">
            <div>
              <span class="hero-substat-label">العدد الأصلي</span>
              <div class="num" style="font-size: 17px; font-weight: 700;">${f(c.n)} طائر</div>
            </div>
            <div>
              <span class="hero-substat-label">النافق</span>
              <div class="num ${k.mort > 5 ? 'color-rose' : ''}" style="font-size: 16px; font-weight: 700;">
                ${k.dead} (${k.mort.toFixed(1)}%)
              </div>
            </div>
            <div style="text-align: left;">
              <span class="hero-substat-label">${k.p >= 0 ? 'صافي الربح' : 'الخسارة'}</span>
              <div class="num ${k.p >= 0 ? 'color-emerald' : 'color-rose'}" style="font-size: 20px; font-weight: 800;">
                ${f(Math.abs(k.p))} ج
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('')}

    <!-- Performance Comparison Chart -->
    <div class="section-title">
      <span>مقارنة أرباح وخسائر الدورات</span>
    </div>
    <div class="card">
      ${profitChart()}
    </div>
  `;
}

// Single Cycle Detail View
function detail(a) {
  const c = cur();
  if (!c) {
    S.v = 'list';
    return list(a);
  }
  const k = calc(c);
  const isOngoing = !c.end;

  let h = `
    <button class="back-btn" onclick="S.v='list'; render()">
      <span>→</span> العودة لكل الدورات
    </button>

    <div class="card hero-card">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="cycle-icon-box" style="width: 50px; height: 50px; font-size: 24px;">🐔</div>
          <div>
            <h2 style="font-size: 24px; font-weight: 800; color: var(--text-title);">${c.name}</h2>
            <div class="hero-substat-label">
              بدأت ${fd(c.start)} ${c.end ? ' • انتهت ' + fd(c.end) : ''}
            </div>
          </div>
        </div>
        <span class="badge ${isOngoing ? 'badge-active' : 'badge-closed'}">
          ${isOngoing ? 'شغالة الآن' : 'مكتملة'}
        </span>
      </div>

      <div class="hero-label" style="margin-top: 16px;">
        ${k.p >= 0 ? 'صافي أرباح الدورة' : 'الخسارة حتى الآن'}
      </div>
      <div class="hero-big-number ${k.p >= 0 ? 'color-emerald' : 'color-rose'}">
        ${f(Math.abs(k.p))} <small>جنيه مصري</small>
      </div>

      <div class="hero-stats-row">
        <div class="hero-substat">
          <span class="hero-substat-label">إجمالي المبيعات (وارد)</span>
          <span class="hero-substat-value color-emerald">${f(k.i)} ج</span>
        </div>
        <div class="hero-substat">
          <span class="hero-substat-label">إجمالي المصروفات (منصرف)</span>
          <span class="hero-substat-value color-rose">${f(k.e)} ج</span>
        </div>
      </div>
    </div>

    <!-- Flock Status Statistics Grid -->
    <div class="section-title">
      <span>حالة القطيع والطيور</span>
    </div>
    <div class="stats-grid">
      ${statBox('العدد الأصلي', f(c.n), 'بداية الدورة', '🐣')}
      ${statBox('النافق', f(k.dead), 'نسبة النفوق ' + k.mort.toFixed(1) + '%', '⚠️', k.mort > 5 ? 'color-rose' : '')}
      ${statBox('المباع', f(k.sold), 'بمتوسط ' + f(k.avg) + ' ج/طائر', '💰', 'color-emerald')}
      ${statBox('المتبقي بالمزرعة', f(Math.max(0, k.live - k.sold)), 'طيور حية', '🏠')}
    </div>

    <!-- Production Efficiency & Cost Grid -->
    <div class="section-title">
      <span>مؤشرات الكفاءة والتكلفة الحيوية</span>
    </div>
    <div class="stats-grid">
      ${statBox('تكلفة الطائر', f(k.cpb) + ' ج', 'المصروف ÷ الحي', '💵')}
      ${statBox('ربح الطائر', f(k.ppb) + ' ج', 'الربح ÷ المباع', '📈', k.ppb >= 0 ? 'color-emerald' : 'color-rose')}
      ${statBox('العلف المستهلك', f(k.fk) + ' كجم', 'إجمالي المشترى', '🌾')}
      ${statBox('معامل التحويل (FCR)', k.fcr ? k.fcr.toFixed(2) : '-', 'كيلو علف / كيلو لحم', '⚖️', k.fcr && k.fcr <= 1.6 ? 'color-emerald' : 'color-amber')}
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs-container">
      ${tabs.map(t => `
        <button class="tab-pill ${S.tab === t[0] ? 'active' : ''}" onclick="S.tab='${t[0]}'; render()">
          ${t[1]}
        </button>
      `).join('')}
    </div>
  `;

  // Render Tab Content
  if (S.tab === 'ch') {
    const by = {};
    c.exp.forEach(e => {
      by[e.cat] = (by[e.cat] || 0) + e.amt;
    });
    const col = ['var(--emerald)', 'var(--sky)', 'var(--amber)', 'var(--rose)', '#8b5cf6', '#6366f1', 'var(--text-muted)'];
    const it = Object.entries(by)
      .sort((x, y) => y[1] - x[1])
      .map(([n, v], i) => ({
        n,
        v,
        c: col[i % col.length],
        t: f(v) + ' ج (' + (k.e ? Math.round((v / k.e) * 100) : 0) + '%)'
      }));

    const rem = Math.max(0, k.live - k.sold);
    const T = c.n || 1;

    h += `
      <div class="card">
        <h3 style="font-size: 17px; font-weight: 800; margin-bottom: 12px; color: var(--text-title);">
          صرفت فلوسك على إيه؟ (توزيع المصاريف)
        </h3>
        ${it.length ? bars(it, x => x.t) : '<div class="empty-state"><div class="empty-state-icon">💸</div>مفيش مصروفات مسجلة بعد</div>'}
      </div>

      <div class="card">
        <h3 style="font-size: 17px; font-weight: 800; margin-bottom: 12px; color: var(--text-title);">
          الطيور راحت فين؟ (توزيع القطيع)
        </h3>
        <div class="bar-track" style="height: 16px; border-radius: 8px;">
          <div class="bar-segment" style="width: ${(k.sold / T) * 100}%; background: var(--emerald);" title="مباع"></div>
          <div class="bar-segment" style="width: ${(k.dead / T) * 100}%; background: var(--rose);" title="نافق"></div>
          <div class="bar-segment" style="width: ${(rem / T) * 100}%; background: var(--sky);" title="باقي"></div>
        </div>
        <div class="legend-wrapper">
          <span class="legend-item"><span class="legend-dot" style="background: var(--emerald);"></span> اتباع: ${f(k.sold)} (${Math.round((k.sold / T) * 100)}%)</span>
          <span class="legend-item"><span class="legend-dot" style="background: var(--rose);"></span> نافق: ${f(k.dead)} (${Math.round((k.dead / T) * 100)}%)</span>
          <span class="legend-item"><span class="legend-dot" style="background: var(--sky);"></span> باقي بالمزرعة: ${f(rem)} (${Math.round((rem / T) * 100)}%)</span>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size: 17px; font-weight: 800; margin-bottom: 12px; color: var(--text-title);">
          مقارنة ربحية هذه الدورة مع الدورات الأخرى
        </h3>
        ${profitChart()}
      </div>
    `;
  } else {
    const T = K[S.tab];
    const arr = c[S.tab] || [];

    h += `
      <button class="btn btn-primary btn-full" onclick="openForm('${S.tab}')">
        <span>+</span> تسجيل ${T.t} جديد
      </button>
    `;

    if (S.tab === 'feed') {
      h += `
        <div class="card" style="margin-top: 14px; padding: 16px;">
          <label style="margin-top: 0;">وزن الشكارة الافتراضي (كجم):</label>
          <input type="number" value="${bagKg}" onchange="bagKg = +this.value || 50" style="max-width: 140px;">
        </div>
      `;
    }

    h += `
      <div class="card" style="margin-top: 14px;">
        ${arr.length ? arr.slice().reverse().map(e => {
          const r = T.r(e);
          const i = arr.indexOf(e);
          return `
            <div class="record-item">
              <div>
                <div class="record-title">${r[0]}</div>
                <div class="record-date">${fd(e.d)}</div>
              </div>
              <div class="record-value-group">
                <span class="record-value">${r[1]}</span>
                <div class="record-actions">
                  ${S.tab === 'debt' ? `
                    <button class="btn btn-sm ${e.paid ? 'btn-outline' : 'btn-primary'}" onclick="pay(${i})">
                      ${e.paid ? 'اتسدد ✓' : 'سدّد الآن'}
                    </button>
                  ` : ''}
                  <button class="btn btn-sm btn-danger" onclick="del(${i})">حذف</button>
                </div>
              </div>
            </div>
          `;
        }).join('') : `
          <div class="empty-state">
            <div class="empty-state-icon">${T.icon}</div>
            مفيش تسجيلات مسجلة في هذا القسم بعد
          </div>
        `}
      </div>
    `;
  }

  if (!c.end) {
    h += `
      <div style="margin-top: 24px;">
        <button class="btn btn-outline btn-full btn-danger" onclick="closeC()">
          قفل هذه الدورة رسمياً (انتهاء البيع)
        </button>
      </div>
    `;
  }

  a.innerHTML = h;
}

function render() {
  const a = document.getElementById('app');
  if (S.v === 'list') {
    list(a);
  } else {
    detail(a);
  }
}

// Modal and Form Handling
const m = document.getElementById('m');
const fm = document.getElementById('fm');

function openForm(kind) {
  const T = K[kind];
  let h = `
    <div class="form-header">
      <div class="form-title">إضافة ${T.t}</div>
      <button type="button" class="btn btn-sm btn-outline" onclick="closeM()">✕</button>
    </div>
    
    <label>التاريخ</label>
    <input type="date" id="f_d" value="${today()}">
  `;

  T.f.forEach(x => {
    h += `<label>${x[3]}</label>`;
    if (x[1] === 'select') {
      h += `
        <select id="f_${x[0]}">
          ${x[2].map(o => `<option value="${o}">${o}</option>`).join('')}
        </select>
      `;
    } else {
      h += `
        <input id="f_${x[0]}" type="${x[1]}" ${x[1] === 'number' ? 'inputmode="decimal" step="any"' : ''} placeholder="${x[3]}">
      `;
    }
  });

  h += `
    <div style="display: flex; gap: 10px; margin-top: 24px;">
      <button class="btn btn-primary" style="flex: 2;" type="submit">حفظ البيانات</button>
      <button class="btn btn-outline" style="flex: 1;" type="button" onclick="closeM()">إلغاء</button>
    </div>
  `;

  fm.innerHTML = h;
  fm.onsubmit = ev => {
    ev.preventDefault();
    const o = { d: document.getElementById('f_d').value || today() };
    T.f.forEach(x => {
      const el = document.getElementById('f_' + x[0]);
      o[x[0]] = x[1] === 'number' ? (+el.value || 0) : el.value;
    });

    if (kind === 'feed') {
      o.kg = o.unit === 'شكارة' ? o.q * bagKg : o.q;
      o.txt = o.q + ' ' + o.unit;
    }
    if (kind === 'debt') {
      o.paid = false;
    }

    cur()[kind].push(o);
    saveData();
    closeM();
    render();
  };

  m.classList.add('on');
}

function newCycle() {
  fm.innerHTML = `
    <div class="form-header">
      <div class="form-title">بدء دورة تسمين جديدة 🐣</div>
      <button type="button" class="btn btn-sm btn-outline" onclick="closeM()">✕</button>
    </div>

    <label>اسم الدورة (مثال: دورة نوفمبر، دفعة رقم 3)</label>
    <input id="nn" value="دورة جديدة" placeholder="اسم الدورة">

    <label>تاريخ استلام الكتاكيت (البداية)</label>
    <input type="date" id="ns" value="${today()}">

    <label>عدد الكتاكيت المستلمة</label>
    <input type="number" id="nc" inputmode="numeric" placeholder="مثلاً: 1000">

    <div style="display: flex; gap: 10px; margin-top: 24px;">
      <button class="btn btn-primary" style="flex: 2;" type="submit">إنشاء الدورة</button>
      <button class="btn btn-outline" style="flex: 1;" type="button" onclick="closeM()">إلغاء</button>
    </div>
  `;

  fm.onsubmit = ev => {
    ev.preventDefault();
    const nn = document.getElementById('nn');
    const ns = document.getElementById('ns');
    const nc = document.getElementById('nc');

    const newObj = {
      id: nid++,
      name: nn.value.trim() || 'دورة بدون اسم',
      start: ns.value || today(),
      end: null,
      n: +nc.value || 0,
      exp: [],
      inc: [],
      dead: [],
      feed: [],
      debt: []
    };

    C.push(newObj);
    saveData();
    closeM();
    S.v = newObj.id;
    S.tab = 'exp';
    render();
  };

  m.classList.add('on');
}

function closeM() {
  m.classList.remove('on');
}

function del(i) {
  if (confirm('هل أنت متأكد من حذف هذا التسجيل نهائياً؟')) {
    cur()[S.tab].splice(i, 1);
    saveData();
    render();
  }
}

function pay(i) {
  const e = cur().debt[i];
  e.paid = !e.paid;
  saveData();
  render();
}

function closeC() {
  if (confirm('هل أنت متأكد من إغلاق هذه الدورة؟ (يمكنك دائماً مراجعة سجلاتها وأرباحها في أي وقت)')) {
    cur().end = today();
    saveData();
    render();
  }
}

// Header & Greeter with Chicken Animation
const gr = document.getElementById('gr');
const dt = document.getElementById('dt');
const hours = new Date().getHours();
const greetingText = hours < 12 ? 'صباح الخير والرزق' : 'مساء الخير والبركة';
gr.innerHTML = `${greetingText} يا رفاعي <span class="chick-anim">🐥</span>`;
dt.textContent = fd(today());

// Theme Toggle
const thBtn = document.getElementById('th');
const thIcon = document.getElementById('th-icon');
const thText = document.getElementById('th-text');

function updateThemeUI(theme) {
  document.documentElement.dataset.theme = theme;
  if (theme === 'light') {
    thIcon.textContent = '☾';
    thText.textContent = 'داكن';
  } else {
    thIcon.textContent = '☀︎';
    thText.textContent = 'فاتح';
  }
}

const savedTheme = localStorage.getItem('refaey_theme') || 'dark';
updateThemeUI(savedTheme);

thBtn.onclick = () => {
  const current = document.documentElement.dataset.theme;
  const target = current === 'light' ? 'dark' : 'light';
  localStorage.setItem('refaey_theme', target);
  updateThemeUI(target);
};

m.onclick = e => {
  if (e.target === m) closeM();
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeM();
});

// Initial Render
render();
</script>
</body>
</html>
